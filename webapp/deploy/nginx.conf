# /etc/nginx/sites-available/cvar-optimizer
#
# Nginx reverse proxy configuration for CVaR Portfolio Optimizer
# Copy this file:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cvar-optimizer
#   sudo ln -s /etc/nginx/sites-available/cvar-optimizer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream cvar_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    # --- Logging ---
    access_log /var/log/nginx/cvar-optimizer.access.log;
    error_log  /var/log/nginx/cvar-optimizer.error.log;

    # --- Security headers ---
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # --- Request size (large portfolios may send big payloads) ---
    client_max_body_size 5M;

    # --- Timeouts (optimization can take time) ---
    proxy_connect_timeout 10s;
    proxy_read_timeout    180s;
    proxy_send_timeout    60s;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # --- Static files (served directly by Nginx) ---
    location /static/ {
        alias /home/user/hedgeFund/webapp/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- API & app → gunicorn ---
    location / {
        proxy_pass http://cvar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
